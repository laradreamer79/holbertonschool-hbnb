<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="images/Palm%20HBNB.png">
    <title>Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Alex+Brush&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <header>
        <a href="index.html" class="brand" aria-label="Go to home page">
            <img src="images/Palm%20HBNB.png" alt="Palm HBNB logo" class="logo">
            <span class="brand-name"><span>HBNB</span><span class="brand-script">Resort</span></span>
        </a>
        <nav class="header-nav" aria-label="Primary navigation">
            <a href="index.html">Home</a>
            <a href="destinations.html">Destinations</a>
            <a href="about.html">About Us</a>
        </nav>
        <div class="header-actions">
            <a href="login.html" id="login-link" class="login-button">Login</a>
            <button id="logout-btn" style="display:none;">Logout</button>
        </div>
    </header>

    <main>
        <section>
            <form id="login-form">
                <h2>Login</h2>

                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>

                <label for="password">Password:</label>
                <input type="password" id="password" name="password" required>

                <button type="submit">Login</button>
            </form>
        </section>
    </main>

    <footer>
        <p>All rights reserved</p>
    </footer>

    <script src="scripts.js"></script>
</body>
</html>
