<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Review</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body id="add-review-page">

    <!-- Header -->
    <header>
        <img src="logo.png" alt="Logo" class="logo">
        <a href="login.html" id="login-link" class="login-button">Login</a>
        <button id="logout-btn" class="login-button" style="display:none;">Logout</button>
    </header>

    <!-- Navigation -->
    <nav>
        <a href="index.html">Home</a>
    </nav>

    <!-- Main -->
    <main>
        <section class="add-review">

            <!-- Place Info -->
            <p id="place-name">Reviewing place...</p>

            <!-- Review Form -->
            <form id="review-form" class="form">
                <h2>Add a Review</h2>

                <label for="review-text">Your Review:</label>
                <textarea id="review-text" name="review-text" required></textarea>

                <label for="rating">Rating:</label>
                <select id="rating" name="rating" required>
                    <option value="">Select rating</option>
                    <option value="1">⭐</option>
                    <option value="2">⭐⭐</option>
                    <option value="3">⭐⭐⭐</option>
                    <option value="4">⭐⭐⭐⭐</option>
                    <option value="5">⭐⭐⭐⭐⭐</option>
                </select>

                <button type="submit">Submit Review</button>
            </form>

        </section>
    </main>

    <!-- Footer -->
    <footer>
        <p>All rights reserved</p>
    </footer>

    <script src="scripts.js"></script>

</body>
</html>
