<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="images/Palm%20HBNB.png">
    <title>Add Review</title>
    <link href="https://fonts.googleapis.com/css2?family=Alex+Brush&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body id="add-review-page">

    <!-- Header -->
    <header>
        <a href="index.html" class="brand" aria-label="Go to home page">
            <img src="images/Palm%20HBNB.png" alt="Palm HBNB logo" class="logo">
            <span class="brand-name"><span>HBNB</span><span class="brand-script">Resort</span></span>
        </a>
        <nav class="header-nav" aria-label="Primary navigation">
            <a href="index.html">Home</a>
            <a href="destinations.html">Destinations</a>
            <a href="about.html">About Us</a>
        </nav>
        <div class="header-actions">
            <a href="login.html" id="login-link" class="login-button">Login</a>
            <button id="logout-btn" class="login-button" style="display:none;">Logout</button>
        </div>
    </header>

    <!-- Main -->
    <main>
        <section class="add-review">

            <!-- Place Info -->
            <p id="place-name">Reviewing place...</p>

            <!-- Review Form -->
            <form id="review-form" class="form">
                <h2>Add a Review</h2>

                <label for="review-text">Your Review:</label>
                <textarea id="review-text" name="review-text" required></textarea>

                <label>Rating:</label>
                <div class="rating-stars" data-rating-stars>
                    <input type="hidden" id="rating" name="rating" required>
                    <button type="button" class="rating-star" data-value="1" aria-label="1 star">★</button>
                    <button type="button" class="rating-star" data-value="2" aria-label="2 stars">★</button>
                    <button type="button" class="rating-star" data-value="3" aria-label="3 stars">★</button>
                    <button type="button" class="rating-star" data-value="4" aria-label="4 stars">★</button>
                    <button type="button" class="rating-star" data-value="5" aria-label="5 stars">★</button>
                </div>

                <button type="submit">Submit Review</button>
            </form>

        </section>
    </main>

    <!-- Footer -->
    <footer>
        <p>All rights reserved</p>
    </footer>

    <script src="scripts.js"></script>

</body>
</html>
